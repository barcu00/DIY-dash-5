name: OpenDash CI

on:
  push:
    branches: [ main, feature/opendash-v0.2, diagnostic/ui-staged-self-test ]
  pull_request:
    branches: [ main ]

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Run native unit tests
        run: pio test -e native

  firmware:
    needs: native-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build Waveshare ESP32-S3 firmware
        run: pio run -e waveshare_5

      - name: Collect firmware binaries
        run: |
          mkdir -p artifacts
          for f in firmware.bin bootloader.bin partitions.bin OpenDash-v0.2-full.bin; do
            if [ -f ".pio/build/waveshare_5/$f" ]; then
              cp ".pio/build/waveshare_5/$f" artifacts/
            fi
          done
          test -f artifacts/firmware.bin
          test -f artifacts/bootloader.bin
          test -f artifacts/partitions.bin
          test -f artifacts/OpenDash-v0.2-full.bin
          ls -lah artifacts

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: OpenDash-v0.2-ui-staged-self-test
          path: artifacts/*
          if-no-files-found: error
