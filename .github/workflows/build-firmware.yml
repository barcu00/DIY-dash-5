name: DIY Dash firmware build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.1.18 Pillow==11.3.0

      - name: Run native unit tests
        run: pio test -e native

      - name: Test firmware packaging
        run: python -m unittest discover -s scripts/tests -v

      - name: Build Waveshare 5 firmware
        run: pio run -e waveshare_5

      - name: Build Waveshare 7 firmware
        run: pio run -e waveshare_7

      - name: Render 800x480 UI previews
        run: python scripts/ui_preview/render_ui_preview.py --output ui-previews

      - name: Collect and verify firmware binaries
        shell: bash
        run: |
          set -euo pipefail
          build_5=.pio/build/waveshare_5
          build_7=.pio/build/waveshare_7
          artifact_dir=artifacts
          mkdir -p "$artifact_dir"

          for file in firmware.bin bootloader.bin partitions.bin \
            DIY-Dash-ESP32-S3-Touch-LCD-5-full.bin flash-layout.json; do
            test -f "$build_5/$file"
            cp "$build_5/$file" "$artifact_dir/$file"
          done

          if test -f "$build_5/boot_app0.bin"; then
            cp "$build_5/boot_app0.bin" "$artifact_dir/boot_app0.bin"
          fi

          for file in firmware.bin bootloader.bin partitions.bin \
            DIY-Dash-ESP32-S3-Touch-LCD-5-full.bin flash-layout.json; do
            test -f "$build_7/$file"
          done

          cp "$build_7/firmware.bin" "$artifact_dir/DIY-Dash-ESP32-S3-Touch-LCD-7-app.bin"
          cp "$build_7/bootloader.bin" "$artifact_dir/DIY-Dash-ESP32-S3-Touch-LCD-7-bootloader.bin"
          cp "$build_7/partitions.bin" "$artifact_dir/DIY-Dash-ESP32-S3-Touch-LCD-7-partitions.bin"
          cp "$build_7/DIY-Dash-ESP32-S3-Touch-LCD-5-full.bin" \
            "$artifact_dir/DIY-Dash-ESP32-S3-Touch-LCD-7-full.bin"
          cp "$build_7/flash-layout.json" "$artifact_dir/DIY-Dash-ESP32-S3-Touch-LCD-7-flash-layout.json"

          if test -f "$build_7/boot_app0.bin"; then
            cp "$build_7/boot_app0.bin" "$artifact_dir/DIY-Dash-ESP32-S3-Touch-LCD-7-boot_app0.bin"
          fi
          cp ui-previews/*.png "$artifact_dir/"

          ls -lah "$artifact_dir"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DIY-Dash-firmware
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
