name: Production LVGL view previews
on:
  push:
    branches: [dashboard-dev, feature/racechrono-ble-monitor]
    paths: ['src/**', 'design/production-preview/**', '.github/workflows/production-view-previews.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch LVGL 8.4
        run: |
          curl -fL https://github.com/lvgl/lvgl/archive/refs/tags/v8.4.0.tar.gz -o /tmp/lvgl.tar.gz
          tar -xzf /tmp/lvgl.tar.gz -C /tmp
      - name: Compile real production views
        shell: bash
        run: |
          mkdir -p /tmp/lvgl-objects
          for source in $(find /tmp/lvgl-8.4.0/src src/ui/fonts -name '*.c'); do
            memory_flag=""
            if [[ "$(basename "$source")" == "lv_mem.c" ]]; then memory_flag="-DARDUINO"; fi
            gcc -O2 $memory_flag -DLV_CONF_INCLUDE_SIMPLE -DLV_LVGL_H_INCLUDE_SIMPLE -Idesign/production-preview -Isrc -I/tmp/lvgl-8.4.0 -c "$source" -o "/tmp/lvgl-objects/$(basename "$source").o"
          done
          g++ -std=c++17 -O2 -DLV_CONF_INCLUDE_SIMPLE -DLV_LVGL_H_INCLUDE_SIMPLE -Idesign/production-preview/host -Idesign/production-preview -Isrc -I/tmp/lvgl-8.4.0 design/production-preview/render.cpp src/settings/app_config.cpp $(find src/telemetry src/ecu src/alarms -name '*.cpp') $(find src/racechrono -name '*.cpp' ! -name 'racechrono_ble_transport.cpp') $(find src/ui -maxdepth 1 -name '*.cpp') /tmp/lvgl-objects/*.o -lm -o /tmp/production-preview
          g++ -std=c++17 -O2 -DLV_CONF_INCLUDE_SIMPLE -DLV_LVGL_H_INCLUDE_SIMPLE -Idesign/production-preview/host -Idesign/production-preview -Isrc -I/tmp/lvgl-8.4.0 design/production-preview/transitions.cpp src/settings/app_config.cpp $(find src/telemetry src/ecu src/alarms -name '*.cpp') $(find src/racechrono -name '*.cpp' ! -name 'racechrono_ble_transport.cpp') $(find src/ui -maxdepth 1 -name '*.cpp') /tmp/lvgl-objects/*.o -lm -o /tmp/ui-transitions
      - name: Check first visible frame after layout selection
        if: success() || failure()
        run: /tmp/ui-transitions
      - name: Check tabbed editor and unified RPM settings
        if: success() || failure()
        run: |
          mkdir -p editor-previews
          /tmp/ui-transitions --editor editor-previews
          mkdir -p editor-partial
          /tmp/ui-transitions --editor editor-partial --partial
          for image in editor-previews/*.ppm; do
            cmp "$image" "editor-partial/$(basename "$image")"
          done
      - name: Check unit-aware warning roundtrip
        if: success() || failure()
        run: /tmp/ui-transitions --units
      - name: Check untouched PSI warning precision
        if: success() || failure()
        run: /tmp/ui-transitions --psi
      - name: Check untouched Fahrenheit limits and delay precision
        if: success() || failure()
        run: /tmp/ui-transitions --tempunits
      - name: Check tile save return
        if: success() || failure()
        run: /tmp/ui-transitions --save
      - name: Check failed tile save retry
        if: success() || failure()
        run: /tmp/ui-transitions --retry
      - name: Check Settings BACK persistence and retry
        if: success() || failure()
        run: /tmp/ui-transitions --settings-save
      - name: Check transactional reset completion and retry
        if: success() || failure()
        run: /tmp/ui-transitions --reset
      - name: Check TRACK first visible frame after layout selection
        if: success() || failure()
        run: /tmp/ui-transitions --track
      - name: Check Analog center editor and parameter selection
        if: success() || failure()
        run: /tmp/ui-transitions --center
      - name: Check BMW MS43 CAN tile parameter selection
        if: success() || failure()
        run: /tmp/ui-transitions --can-tile
      - name: Check RaceChrono settings transitions and redraws
        if: success() || failure()
        run: |
          mkdir -p racechrono-previews racechrono-partial
          /tmp/ui-transitions --racechrono racechrono-previews
          /tmp/ui-transitions --racechrono racechrono-partial --partial
          for image in racechrono-previews/*.ppm; do
            cmp "$image" "racechrono-partial/$(basename "$image")"
          done
      - name: Render and check production framebuffers
        if: success() || failure()
        run: |
          mkdir -p production-previews
          /tmp/production-preview production-previews
          python -m pip install Pillow==11.3.0
          python design/production-preview/convert.py production-previews
          mkdir -p direct-previews
          /tmp/production-preview direct-previews --direct
          python design/production-preview/convert.py direct-previews
          for image in production-previews/*.png; do
            cmp "$image" "direct-previews/$(basename "$image")"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Production-LVGL-previews
          path: production-previews/*.png
          retention-days: 30
      - name: Convert RaceChrono captures
        if: success() || failure()
        run: |
          python -m pip install Pillow==11.3.0
          python -c "from pathlib import Path; from PIL import Image; [Image.open(p).save(p.with_suffix('.png')) for p in Path('racechrono-previews').glob('*.ppm')]"
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: RaceChrono-LVGL-previews
          path: racechrono-previews/*.png
          retention-days: 30
      - name: Convert editor captures
        if: success() || failure()
        run: |
          python -m pip install Pillow==11.3.0
          python -c "from pathlib import Path; from PIL import Image; [Image.open(p).save(p.with_suffix('.png')) for p in Path('editor-previews').glob('*.ppm')]"
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: Editor-LVGL-previews
          path: editor-previews/*.png
          retention-days: 30
