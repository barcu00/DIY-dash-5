name: CAN IO hardware

on:
  push:
    paths:
      - "hardware/can-io-module/**"
      - "scripts/check_can_io_hardware.py"
      - "scripts/export_can_io_hardware.ps1"
      - "test/hardware/**"
      - "test/__init__.py"
      - ".github/workflows/can-io-hardware.yml"
  pull_request:
    paths:
      - "hardware/can-io-module/**"
      - "scripts/check_can_io_hardware.py"
      - "scripts/export_can_io_hardware.ps1"
      - "test/hardware/**"
      - "test/__init__.py"
      - ".github/workflows/can-io-hardware.yml"
  workflow_dispatch:

jobs:
  can-io-hardware:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install KiCad 9
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install --yes kicad
          kicad-cli version

      - name: Prepare export directory
        run: mkdir -p hardware/can-io-module/manufacturing/generated/{gerbers,drill,position}

      - name: Validate checked-in hardware contract
        shell: bash
        run: |
          set +e
          python3 scripts/check_can_io_hardware.py 2>&1 | tee hardware/can-io-module/manufacturing/generated/contract-report.txt
          validator_status=${PIPESTATUS[0]}
          python3 -m unittest test.hardware.test_can_io_hardware -v 2>&1 | tee -a hardware/can-io-module/manufacturing/generated/contract-report.txt
          test_status=${PIPESTATUS[0]}
          {
            echo '## CAN I/O hardware contract'
            echo '```text'
            cat hardware/can-io-module/manufacturing/generated/contract-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if (( validator_status != 0 || test_status != 0 )); then exit 1; fi

      - name: Electrical rules check
        run: >-
          kicad-cli sch erc --exit-code-violations
          --output hardware/can-io-module/manufacturing/generated/erc-report.rpt
          hardware/can-io-module/can-io-module.kicad_sch

      - name: Design rules check
        shell: bash
        run: |
          set +e
          kicad-cli pcb drc --exit-code-violations --all-track-errors --schematic-parity \
            --output hardware/can-io-module/manufacturing/generated/drc-report.rpt \
            hardware/can-io-module/can-io-module.kicad_pcb \
            2>&1 | tee hardware/can-io-module/manufacturing/generated/drc-command.log
          drc_status=${PIPESTATUS[0]}
          {
            echo '## KiCad PCB DRC'
            echo '```text'
            cat hardware/can-io-module/manufacturing/generated/drc-command.log
            if [[ -f hardware/can-io-module/manufacturing/generated/drc-report.rpt ]]; then
              cat hardware/can-io-module/manufacturing/generated/drc-report.rpt
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$drc_status"

      - name: Export review and fabrication files
        run: |
          kicad-cli sch export pdf --output hardware/can-io-module/manufacturing/generated/can-io-module-schematic.pdf hardware/can-io-module/can-io-module.kicad_sch
          kicad-cli pcb export svg --layers F.Cu,B.Cu,F.Silkscreen,B.Silkscreen,Edge.Cuts --output hardware/can-io-module/manufacturing/generated/can-io-module-pcb.svg hardware/can-io-module/can-io-module.kicad_pcb
          kicad-cli pcb export gerbers --output hardware/can-io-module/manufacturing/generated/gerbers/ hardware/can-io-module/can-io-module.kicad_pcb
          kicad-cli pcb export drill --output hardware/can-io-module/manufacturing/generated/drill/ hardware/can-io-module/can-io-module.kicad_pcb
          kicad-cli pcb export pos --format csv --units mm --output hardware/can-io-module/manufacturing/generated/position/can-io-module-top-pos.csv hardware/can-io-module/can-io-module.kicad_pcb
          cp hardware/can-io-module/bom/*.csv hardware/can-io-module/manufacturing/generated/

      - name: Upload reports and prototype package
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: can-io-hardware-prototype
          path: hardware/can-io-module/manufacturing/generated
          if-no-files-found: warn
