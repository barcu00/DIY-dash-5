<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173f31"/>
      <stop offset="1" stop-color="#0d2c23"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <style>
      .silk{fill:none;stroke:#f2f1dc;stroke-width:2}
      .ref{fill:#f2f1dc;font:700 15px Arial,sans-serif;text-anchor:middle}
      .value{fill:#a9c9bd;font:12px Arial,sans-serif;text-anchor:middle}
      .zone{fill:#76a99a;font:700 14px Arial,sans-serif;letter-spacing:1.2px;text-anchor:middle}
      .note{fill:#6e958a;font:11px Arial,sans-serif;text-anchor:middle}
      .pad{fill:#d9b44a;stroke:#f7da76;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="900" fill="#091018"/>
  <text x="70" y="65" fill="#f4f7fa" font-family="Arial,sans-serif" font-size="30" font-weight="700">DIY DASH 5 — CAN I/O MODULE</text>
  <text x="70" y="96" fill="#8595a3" font-family="Arial,sans-serif" font-size="16">REVISION A · TOP PLACEMENT VIEW · 96 × 86 mm</text>

  <!-- 96 x 86 mm board, scaled 9 px/mm -->
  <g transform="translate(168 105)" filter="url(#shadow)">
    <rect x="0" y="0" width="864" height="774" rx="5" fill="url(#board)" stroke="#e6e8e4" stroke-width="3"/>
    <rect x="4" y="4" width="856" height="766" rx="3" fill="none" stroke="#507669" stroke-width="1"/>

    <!-- connector J1 at (56,25), board origin (20,20) -->
    <g transform="translate(324 45)">
      <rect x="-34" y="-27" width="278" height="129" rx="6" class="silk"/>
      <text x="105" y="-38" class="ref">J1 · 24-PIN FCI ECU CONNECTOR</text>
      <g>
        <rect x="-10" y="-10" width="21" height="21" rx="2" class="pad"/>
        <ellipse cx="30" cy="0" rx="11" ry="10" class="pad"/><ellipse cx="60" cy="0" rx="11" ry="10" class="pad"/>
        <ellipse cx="90" cy="0" rx="11" ry="10" class="pad"/><ellipse cx="120" cy="0" rx="11" ry="10" class="pad"/>
        <ellipse cx="150" cy="0" rx="11" ry="10" class="pad"/><ellipse cx="180" cy="0" rx="11" ry="10" class="pad"/>
        <ellipse cx="210" cy="0" rx="11" ry="10" class="pad"/>
        <ellipse cx="0" cy="37" rx="11" ry="10" class="pad"/><ellipse cx="30" cy="37" rx="11" ry="10" class="pad"/>
        <ellipse cx="60" cy="37" rx="11" ry="10" class="pad"/><ellipse cx="90" cy="37" rx="11" ry="10" class="pad"/>
        <ellipse cx="120" cy="37" rx="11" ry="10" class="pad"/><ellipse cx="150" cy="37" rx="11" ry="10" class="pad"/>
        <ellipse cx="180" cy="37" rx="11" ry="10" class="pad"/><ellipse cx="210" cy="37" rx="11" ry="10" class="pad"/>
        <ellipse cx="0" cy="75" rx="11" ry="10" class="pad"/><ellipse cx="30" cy="75" rx="11" ry="10" class="pad"/>
        <ellipse cx="60" cy="75" rx="11" ry="10" class="pad"/><ellipse cx="90" cy="75" rx="11" ry="10" class="pad"/>
        <ellipse cx="120" cy="75" rx="11" ry="10" class="pad"/><ellipse cx="150" cy="75" rx="11" ry="10" class="pad"/>
        <ellipse cx="180" cy="75" rx="11" ry="10" class="pad"/><ellipse cx="210" cy="75" rx="11" ry="10" class="pad"/>
      </g>
      <text x="0" y="-15" class="value" text-anchor="start">PIN 1 · VBAT</text>
    </g>

    <!-- power -->
    <text x="90" y="250" class="zone">POWER</text>
    <g transform="translate(90 225)"><rect x="-45" y="-36" width="90" height="72" rx="4" class="silk"/><text y="-47" class="ref">U2</text><text y="55" class="value">LMR16006Y-Q1</text></g>

    <!-- comms and MCU -->
    <text x="423" y="270" class="zone">MCU / CAN / K-LINE</text>
    <g transform="translate(423 342)"><rect x="-54" y="-54" width="108" height="108" rx="5" class="silk"/><text y="-65" class="ref">U1</text><text y="74" class="value">STM32G0B1CBT6</text></g>
    <g transform="translate(288 261)"><rect x="-45" y="-32" width="90" height="64" rx="4" class="silk"/><text y="-43" class="ref">U7</text><text y="51" class="value">L9613 · K-LINE</text></g>
    <g transform="translate(387 225)"><rect x="-45" y="-32" width="90" height="64" rx="4" class="silk"/><text y="-43" class="ref">U8</text><text y="51" class="value">TJA1051T/3 · CAN</text></g>

    <!-- EGT quiet area -->
    <rect x="639" y="162" width="171" height="153" rx="7" fill="#263d35" fill-opacity=".65" stroke="#e5a64f" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="720" y="332" class="zone" fill="#e5a64f">EGT QUIET ZONE</text>
    <g transform="translate(693 225)"><rect x="-50" y="-36" width="100" height="72" rx="4" class="silk"/><text y="-47" class="ref">U10</text><text y="55" class="value">MAX31855K</text></g>
    <g transform="translate(639 360)"><rect x="-45" y="-32" width="90" height="64" rx="4" class="silk"/><text y="-43" class="ref">U11</text><text y="51" class="value">FLEX SCHMITT</text></g>

    <!-- analog -->
    <text x="333" y="621" class="zone">8 × ANALOG / RESISTIVE INPUTS</text>
    <g transform="translate(252 522)"><rect x="-63" y="-36" width="126" height="72" rx="4" class="silk"/><text y="-47" class="ref">U5</text><text y="55" class="value">74HCT4051 · 1 kΩ BANK</text></g>
    <g transform="translate(405 522)"><rect x="-63" y="-36" width="126" height="72" rx="4" class="silk"/><text y="-47" class="ref">U6</text><text y="55" class="value">74HCT4051 · 4.7 kΩ BANK</text></g>

    <!-- outputs -->
    <text x="720" y="648" class="zone">OUTPUTS</text>
    <g transform="translate(657 522)"><rect x="-50" y="-36" width="100" height="72" rx="4" class="silk"/><text y="-47" class="ref">U9</text><text y="55" class="value">TLV9002-Q1 · 0–5 V</text></g>
    <g transform="translate(783 468)"><rect x="-36" y="-36" width="72" height="72" rx="4" class="silk"/><text y="-47" class="ref">Q4</text><text y="54" class="value">RELAY 1</text></g>
    <g transform="translate(783 594)"><rect x="-36" y="-36" width="72" height="72" rx="4" class="silk"/><text y="-47" class="ref">Q5</text><text y="54" class="value">RELAY 2</text></g>

    <text x="432" y="718" class="note">BOTTOM LAYER: POWER_GND PLANE · NO ROUTED SIGNAL TRACKS IN REVISION A</text>
    <text x="90" y="742" class="note">PROTOTYPE REV A</text>
  </g>

  <g transform="translate(70 845)">
    <rect width="13" height="13" fill="#d9b44a"/><text x="22" y="12" fill="#aab6bf" font-family="Arial,sans-serif" font-size="14">connector pads</text>
    <rect x="190" width="13" height="13" fill="none" stroke="#f2f1dc" stroke-width="2"/><text x="212" y="12" fill="#aab6bf" font-family="Arial,sans-serif" font-size="14">temporary placement blocks</text>
    <rect x="470" width="13" height="13" fill="none" stroke="#e5a64f" stroke-width="2"/><text x="492" y="12" fill="#aab6bf" font-family="Arial,sans-serif" font-size="14">sensitive keep-out area</text>
  </g>
</svg>
